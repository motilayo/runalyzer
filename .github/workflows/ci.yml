name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Prepare iOS Simulator
        id: simulator
        run: |
          echo "Finding available iPhone simulator..."
          DEVICE_JSON=$(xcrun simctl list devices available -j)
          DEVICE_UDID=$(echo "$DEVICE_JSON" | grep -B 1 '"isAvailable" : true' | grep '"udid"' | head -n 1 | awk -F '"' '{print $4}')

          if [ -z "$DEVICE_UDID" ]; then
            # Fallback to creating an iPhone 16 device on latest iOS runtime
            RUNTIME=$(xcrun simctl list runtimes available -j | grep '"identifier"' | grep -i 'SimRuntime.iOS' | head -n 1 | awk -F '"' '{print $4}')
            echo "Creating simulator with runtime: $RUNTIME"
            DEVICE_UDID=$(xcrun simctl create "CI-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
          fi

          echo "Using Simulator UDID: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true
          echo "device_udid=$DEVICE_UDID" >> $GITHUB_OUTPUT

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Runalyzer.xcodeproj \
            -scheme Runalyzer \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_udid }}" \
            -derivedDataPath .build/derivedData \
            -resultBundlePath .build/derivedData/TestResults.xcresult \
            -parallel-testing-enabled YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload Test Results (.xcresult)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: .build/derivedData/TestResults.xcresult
          if-no-files-found: ignore
